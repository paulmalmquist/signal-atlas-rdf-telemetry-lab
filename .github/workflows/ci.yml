name: Synthetic lab tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m backend.build
      - run: python -m pytest -q
# Scaffolding only: this workflow was not run on GitHub during delivery.
# Pin reviewed action commit SHAs in your company's own workflow before adoption.
